name: Deploy WuPark Frontend to Amplify

on:
  push:
    branches:
      - main
      - aws_deploy
    paths:
      - 'frontEnd/**'

env:
  NODE_VERSION: '18'
  AWS_DEFAULT_REGION: 'us-east-1'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Don't set registry-url to avoid authentication issues

      - name: Clear npm authentication and reset config
        run: |
          # Remove any existing npm authentication
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config delete _authToken 2>/dev/null || true
          npm config delete //npm.pkg.github.com/:_authToken 2>/dev/null || true
          npm config delete //kochag.pkgs.visualstudio.com/_packaging/KochAg/npm/registry/:_password 2>/dev/null || true
          npm config delete //kochag.pkgs.visualstudio.com/_packaging/KochAg/npm/registry/:username 2>/dev/null || true
          npm config delete always-auth 2>/dev/null || true
          # Reset registry to public npm
          npm config set registry https://registry.npmjs.org/
          # Clear npm cache to ensure fresh start
          npm cache clean --force
          # Verify config is clean
          echo "npm config list:"
          npm config list

      - name: Install dependencies
        working-directory: ./frontEnd
        run: |
          # Delete package-lock.json and regenerate with public registry
          rm -f package-lock.json
          npm install --registry https://registry.npmjs.org
        env:
          # Ensure no authentication is attempted
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Run linter
        working-directory: ./frontEnd
        run: npm run lint --if-present

      - name: Build application
        working-directory: ./frontEnd
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://your-api-gateway-url.amazonaws.com/prod' }}
          REACT_APP_ENVIRONMENT: production

  deploy-amplify:
    name: Deploy to Amplify
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Trigger Amplify Build
        run: |
          # Set Amplify app details based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            AMPLIFY_APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
            BRANCH_NAME="main"
            ENVIRONMENT="production"
          else
            AMPLIFY_APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
            BRANCH_NAME="aws_deploy"
            ENVIRONMENT="staging"
          fi
          
          echo "Triggering Amplify build for app: $AMPLIFY_APP_ID, branch: $BRANCH_NAME"
          
          # Start Amplify build
          JOB_ID=$(aws amplify start-job --app-id $AMPLIFY_APP_ID --branch-name $BRANCH_NAME --job-type RELEASE --query 'jobSummary.jobId' --output text)
          echo "Build job started with ID: $JOB_ID"
          echo "job-id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "app-id=$AMPLIFY_APP_ID" >> $GITHUB_OUTPUT
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        id: amplify-deploy

      - name: Wait for Amplify Build
        run: |
          APP_ID="${{ steps.amplify-deploy.outputs.app-id }}"
          BRANCH_NAME="${{ steps.amplify-deploy.outputs.branch-name }}"
          JOB_ID="${{ steps.amplify-deploy.outputs.job-id }}"
          
          echo "Waiting for Amplify build to complete..."
          
          # Wait for build to complete (timeout after 10 minutes)
          TIMEOUT=600
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws amplify get-job --app-id $APP_ID --branch-name $BRANCH_NAME --job-id $JOB_ID --query 'job.summary.status' --output text)
            
            case $STATUS in
              "SUCCEED")
                echo "✅ Amplify build completed successfully!"
                break
                ;;
              "FAILED"|"CANCELLED")
                echo "❌ Amplify build failed with status: $STATUS"
                exit 1
                ;;
              "RUNNING"|"PENDING")
                echo "⏳ Build status: $STATUS (elapsed: ${ELAPSED}s)"
                sleep 30
                ELAPSED=$((ELAPSED + 30))
                ;;
              *)
                echo "Unknown status: $STATUS"
                sleep 30
                ELAPSED=$((ELAPSED + 30))
                ;;
            esac
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Build timed out after $TIMEOUT seconds"
            exit 1
          fi

      - name: Get Amplify App URL
        id: get-url
        run: |
          APP_ID="${{ steps.amplify-deploy.outputs.app-id }}"
          BRANCH_NAME="${{ steps.amplify-deploy.outputs.branch-name }}"
          
          # Get the app URL
          APP_URL="https://$BRANCH_NAME.$APP_ID.amplifyapp.com"
          echo "app-url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "🚀 WuPark Amplify deployment completed!"
          echo "Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}"
          echo "Branch: ${{ github.ref == 'refs/heads/main' && 'main' || 'aws_deploy' }}"
          echo "App URL: ${{ steps.get-url.outputs.app-url }}"
          echo "Job ID: ${{ steps.amplify-deploy.outputs.job-id }}"