name: Deploy WuPark Frontend with Amplify

on:
  push:
    branches:
      - main
      - aws_deploy
    paths:
      - 'frontEnd/**'

env:
  NODE_VERSION: '18'
  AWS_DEFAULT_REGION: 'us-east-1'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Don't set registry-url to avoid authentication issues

      - name: Clear npm authentication and reset config
        run: |
          # Remove any existing npm authentication
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config delete _authToken 2>/dev/null || true
          npm config delete //npm.pkg.github.com/:_authToken 2>/dev/null || true
          npm config delete //kochag.pkgs.visualstudio.com/_packaging/KochAg/npm/registry/:_password 2>/dev/null || true
          npm config delete //kochag.pkgs.visualstudio.com/_packaging/KochAg/npm/registry/:username 2>/dev/null || true
          npm config delete always-auth 2>/dev/null || true
          # Reset registry to public npm
          npm config set registry https://registry.npmjs.org/
          # Clear npm cache to ensure fresh start
          npm cache clean --force
          # Verify config is clean
          echo "npm config list:"
          npm config list

      - name: Install dependencies
        working-directory: ./frontEnd
        run: |
          # Delete package-lock.json and regenerate with public registry
          rm -f package-lock.json
          npm install --registry https://registry.npmjs.org
        env:
          # Ensure no authentication is attempted
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Run linter
        working-directory: ./frontEnd
        run: npm run lint --if-present

      - name: Build application
        working-directory: ./frontEnd
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://your-api-gateway-url.amazonaws.com/prod' }}
          REACT_APP_ENVIRONMENT: production

  deploy-s3-cloudfront:
    name: Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clear npm config
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config delete _authToken 2>/dev/null || true
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./frontEnd
        run: |
          rm -f package-lock.json
          npm install --registry https://registry.npmjs.org

      - name: Build React app
        working-directory: ./frontEnd
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}
          REACT_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Deploy to S3
        working-directory: ./frontEnd
        run: |
          # Set bucket name based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BUCKET_NAME="${{ secrets.PROD_S3_BUCKET || 'wupark-frontend-prod' }}"
            ENVIRONMENT="production"
          else
            BUCKET_NAME="${{ secrets.STAGING_S3_BUCKET || 'wupark-frontend-staging' }}"
            ENVIRONMENT="staging"
          fi
          
          echo "Deploying to S3 bucket: $BUCKET_NAME"
          echo "Environment: $ENVIRONMENT"
          
          # Create bucket if it doesn't exist
          aws s3 mb s3://$BUCKET_NAME 2>/dev/null || echo "Bucket already exists"
          
          # Enable static website hosting
          aws s3 website s3://$BUCKET_NAME --index-document index.html --error-document index.html
          
          # Upload files to S3
          aws s3 sync build/ s3://$BUCKET_NAME --delete --exact-timestamps
          
          # Set bucket policy for public read
          cat > bucket-policy.json << EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::$BUCKET_NAME/*"
              }
            ]
          }
          EOF
          
          aws s3api put-bucket-policy --bucket $BUCKET_NAME --policy file://bucket-policy.json
          
          # Output website URL
          WEBSITE_URL="http://$BUCKET_NAME.s3-website-${{ env.AWS_DEFAULT_REGION }}.amazonaws.com"
          echo "Website URL: $WEBSITE_URL"
          echo "website-url=$WEBSITE_URL" >> $GITHUB_OUTPUT
        id: s3-deploy

      - name: Deployment Summary
        run: |
          echo "🚀 WuPark Frontend deployment completed!"
          echo "Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}"
          echo "Branch: ${{ github.ref == 'refs/heads/main' && 'main' || 'aws_deploy' }}"
          echo "Website URL: ${{ steps.s3-deploy.outputs.website-url }}"

      - name: Get Amplify App URL
        id: get-url
        run: |
          # Get the Amplify app ID from the deployment
          APP_ID=$(aws amplify list-apps --query "apps[?name=='WuPark' || name=='frontEnd'].appId" --output text)
          if [ -n "$APP_ID" ]; then
            BRANCH_NAME=${{ github.ref == 'refs/heads/main' && 'main' || 'aws_deploy' }}
            APP_URL="https://$BRANCH_NAME.$APP_ID.amplifyapp.com"
            echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
          else
            echo "app-url=Not available yet" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Summary
        run: |
          echo "🚀 WuPark Amplify deployment completed!"
          echo "Environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}"
          echo "Branch: ${{ github.ref == 'refs/heads/main' && 'main' || 'aws_deploy' }}"
          echo "App URL: ${{ steps.get-url.outputs.app-url }}"