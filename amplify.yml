version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontEnd
        - npm ci
    build:
      commands:
        - echo "REACT_APP_API_URL=$REACT_APP_API_URL" > .env.production
        - echo "REACT_APP_AVAILABILITY_API_KEY=$REACT_APP_AVAILABILITY_API_KEY" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: frontEnd/build
    files:
      - '**/*'
  cache:
    paths:
      - frontEnd/node_modules/**/*
      - frontEnd/.npm/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Content-Security-Policy'
          value: "default-src 'self' https://*.amazonaws.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'"
  logging:
    accessLogs:
      - destinationType: CloudWatch
        logGroupName: /aws/amplify/wupark-frontend/access
    applicationLogs:
      - destinationType: CloudWatch
        logGroupName: /aws/amplify/wupark-frontend/application
        logStreamName: ${BUILD_ID}