version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontEnd
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontEnd/build
    files:
      - '**/*'
  cache:
    paths:
      - frontEnd/node_modules/**/*
      - frontEnd/node_modules/**/*