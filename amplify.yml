version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontEnd
        - rm -f package-lock.json
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontEnd/build
    files:
      - '**/*'
  cache:
    paths:
      - frontEnd/node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'
  environment:
    variables:
      REACT_APP_API_URL: your-actual-api-gateway-url
      - frontEnd/node_modules/**/*